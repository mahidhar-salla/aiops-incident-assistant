[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiops-incident-assistant"
version = "0.1.0"
description = "LLM-assisted incident triage: redacts logs, retrieves runbooks and drafts a summary and RCA where every claim cites a log line or runbook section. Evaluated on labelled synthetic incidents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mahidhar Salla" }]
keywords = ["sre", "aiops", "incident-response", "rca", "llm", "rag", "bedrock", "ollama"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: System :: Monitoring",
  "Environment :: Console",
]
dependencies = ["typer>=0.12", "rich>=13", "pydantic>=2.5", "pyyaml>=6"]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.urls]
Homepage = "https://github.com/mahidhar-salla/aiops-incident-assistant"
Issues = "https://github.com/mahidhar-salla/aiops-incident-assistant/issues"

[project.scripts]
aiops-assistant = "aiops_assistant.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aiops_assistant"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S603", "RUF001", "B008"]  # B008: typer options as defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"src/aiops_assistant/synth.py" = ["E501", "S311"]  # long synthetic log lines; seeded RNG for data, not crypto
"scripts/*" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["typer.*", "rich.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
